<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Price Wars: Human vs AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  ============================================================

  Firestore (free tier is plenty for this). Before you host

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>

<style>
  :root{
    --ink:#16241F;
    --ink-2:#1D2E27;
    --parchment:#F1E9D8;
    --parchment-2:#E8DDC6;
    --brass:#C69B3C;
    --brass-bright:#E0B84B;
    --ai-teal:#3FCDB4;
    --maroon:#8C3B3B;
    --text-dark:#20201B;
    --text-light:#F1E9D8;
    --shadow: 0 10px 30px rgba(0,0,0,.35);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ } }
  *{box-sizing:border-box;}
  html{scroll-padding-top: env(safe-area-inset-top, 0px); min-height:100%;}
  body{
    margin:0;
    background: radial-gradient(circle at 20% -10%, #223b32 0%, var(--ink) 45%, #0f1a15 100%);
    color: var(--text-light);
    font-family: 'Inter', system-ui, sans-serif;
    min-height:100%;
    -webkit-font-smoothing:antialiased;
  }
  #root{min-height:100vh; display:flex; flex-direction:column;}

  h1,h2,h3,.display{
    font-family:'Fraunces', serif;
    font-weight:600;
    letter-spacing:-0.01em;
    margin:0;
  }
  .num{ font-variant-numeric: tabular-nums; }

  a, button{ font-family: inherit; }
  button{ cursor:pointer; border:none; }
  button:disabled{ cursor:not-allowed; opacity:.5; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:.5em;
    padding: .85em 1.6em;
    border-radius: 999px;
    font-weight:600;
    font-size: 1rem;
    background: var(--brass);
    color: #1a1305;
    transition: transform .12s ease, background .2s ease;
  }
  .btn:hover:not(:disabled){ background: var(--brass-bright); transform: translateY(-1px); }
  .btn:active:not(:disabled){ transform: translateY(0); }
  .btn.secondary{ background: transparent; color: var(--parchment); border: 1.5px solid rgba(241,233,216,.35); }
  .btn.secondary:hover:not(:disabled){ background: rgba(241,233,216,.08); }
  .btn.danger{ background: transparent; color: #e2a3a3; border: 1.5px solid rgba(226,163,163,.4); }
  .btn.wide{ width:100%; }
  .btn.small{ padding:.5em 1.1em; font-size:.85rem; }

  input[type=text], input[type=number]{
    font-family: 'Inter', sans-serif;
    background: rgba(241,233,216,.08);
    border: 1.5px solid rgba(241,233,216,.25);
    color: var(--parchment);
    padding: .9em 1em;
    border-radius: 12px;
    font-size: 1.05rem;
    width:100%;
    outline: none;
  }
  input::placeholder{ color: rgba(241,233,216,.4); }
  input:focus{ border-color: var(--brass); }

  .center-wrap{
    flex:1; display:flex; align-items:center; justify-content:center;
    padding: 24px 18px;
  }
  .shell{ width:100%; max-width: 440px; }
  .shell.wide{ max-width: 1180px; }

  .eyebrow-mark{
    display:flex; align-items:center; gap:10px; margin-bottom: 28px; justify-content:center;
  }
  .eyebrow-mark .ring{
    width:34px;height:34px;border-radius:50%;
    border:2px solid var(--brass); display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif; font-weight:700; color:var(--brass); font-size:15px;
  }
  .eyebrow-mark span.title{ font-family:'Fraunces',serif; font-size:1.05rem; color:var(--parchment); }
  .eyebrow-mark span.vs{ color: var(--ai-teal); font-weight:600; }

  .card{
    background: linear-gradient(180deg, rgba(241,233,216,.05), rgba(241,233,216,.02));
    border: 1px solid rgba(241,233,216,.14);
    border-radius: 20px;
    padding: 28px;
    box-shadow: var(--shadow);
  }
  .role-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:22px; }
  @media (max-width:480px){ .role-grid{ grid-template-columns:1fr; } }
  .role-card{
    background: rgba(241,233,216,.04);
    border:1.5px solid rgba(241,233,216,.16);
    border-radius:16px;
    padding: 22px 16px;
    text-align:center;
    transition: border-color .15s ease, transform .15s ease, background .15s ease;
  }
  .role-card:hover{ border-color: var(--brass); transform: translateY(-2px); background: rgba(241,233,216,.07); }
  .role-card .icon{ font-size:1.8rem; margin-bottom:8px; display:block; }
  .role-card h3{ font-size:1.05rem; margin-bottom:4px; }
  .role-card p{ font-size:.82rem; color: rgba(241,233,216,.6); margin:0; }

  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:.8rem; color: rgba(241,233,216,.65); margin-bottom:6px; }

  .add-team-row{ display:flex; gap:10px; }
  .add-team-row input{ flex:1; }
  .team-chip-list{ display:flex; flex-direction:column; gap:8px; margin-top:10px; max-height:220px; overflow-y:auto; }
  .team-chip{
    display:flex; align-items:center; justify-content:space-between;
    background: rgba(241,233,216,.05); border:1px solid rgba(241,233,216,.12);
    border-radius: 12px; padding: 8px 14px;
  }
  .team-chip .name{ font-weight:600; font-size:.9rem; }
  .team-chip button{ background:none; color:#e2a3a3; font-size:.76rem; }
  .members-line{ font-size:.76rem; color: rgba(241,233,216,.5); margin-top:2px; }

  .code-plate{
    background: var(--parchment);
    color: var(--ink);
    border-radius: 14px;
    padding: 18px 20px;
    text-align:center;
    box-shadow: inset 0 0 0 3px rgba(198,155,60,.5);
  }
  .code-plate .code{
    font-family:'Fraunces',serif; font-weight:700; letter-spacing: .12em;
    font-size: 2.1rem; color: var(--ink);
  }
  .code-plate .sub{ font-size:.78rem; color:#5b5342; margin-top:4px; }

  /* Lot card (product) */
  .lot{
    background: var(--parchment);
    color: var(--text-dark);
    border-radius: 20px;
    overflow:hidden;
    box-shadow: var(--shadow);
    border: 6px solid #0000;
    border-image: none;
    position:relative;
  }
  .lot .lot-frame{
    margin: 14px;
    border: 1.5px solid rgba(32,32,27,.18);
    border-radius: 12px;
    padding: 14px;
  }
  .lot .lot-number{
    position:absolute; top:16px; left:16px;
    background: var(--ink); color: var(--brass-bright);
    font-family:'Fraunces',serif; font-weight:600; font-size:.78rem;
    padding: 5px 12px; border-radius: 999px; letter-spacing:.03em;
    z-index:2;
  }
  .lot img{ width:100%; display:block; border-radius: 8px; aspect-ratio: 4/3; object-fit: cover; background:#ddd; }
  .lot .lot-body{ padding: 16px 6px 4px; }
  .lot h2{ font-size:1.35rem; line-height:1.15; margin-bottom:4px; }
  .lot .circa{ font-size:.78rem; color:#7a6f57; text-transform:uppercase; letter-spacing:.06em; margin-bottom:10px; }
  .lot .desc{ font-size:.92rem; color:#4a4638; line-height:1.5; }

  .timer-ring-wrap{ display:flex; align-items:center; justify-content:center; margin: 4px 0 18px; }
  .timer-ring{ position:relative; width:96px; height:96px; }
  .timer-ring svg{ transform: rotate(-90deg); width:100%; height:100%; }
  .timer-ring .tnum{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces',serif; font-weight:700; font-size:1.7rem; color: var(--parchment);
  }

  .guess-row{ display:flex; gap:10px; align-items:stretch; }
  .guess-row .prefix{
    display:flex; align-items:center; padding: 0 14px;
    background: rgba(241,233,216,.08); border:1.5px solid rgba(241,233,216,.25);
    border-radius:12px; font-weight:700; color: var(--brass-bright);
  }

  .status-line{ text-align:center; font-size:.9rem; color: rgba(241,233,216,.65); margin: 10px 0 4px; }

  .team-list{ display:flex; flex-direction:column; gap:8px; margin-top:10px; }
  .team-row{
    display:flex; align-items:center; justify-content:space-between;
    background: rgba(241,233,216,.05); border:1px solid rgba(241,233,216,.12);
    border-radius: 12px; padding: 10px 14px;
  }
  .team-row .rank{ font-family:'Fraunces',serif; font-weight:700; color: var(--brass); width:28px; }
  .team-row .name{ flex:1; font-weight:600; }
  .team-row .credits{ font-weight:700; }
  .team-row.you{ border-color: var(--ai-teal); background: rgba(63,205,180,.08); }
  .team-row.winner{ box-shadow: inset 0 0 0 1.5px var(--brass); }
  .delta-up{ color:#7CD98A; font-weight:700; font-size:.85rem; }
  .delta-down{ color:#E29999; font-weight:700; font-size:.85rem; }
  .delta-flat{ color: rgba(241,233,216,.5); font-weight:600; font-size:.85rem; }

  .host-grid{ display:grid; grid-template-columns: 1.4fr 1fr; gap:22px; align-items:start; }
  @media (max-width: 880px){ .host-grid{ grid-template-columns:1fr; } }

  .topbar{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;
    padding: 16px 22px; border-bottom: 1px solid rgba(241,233,216,.12);
  }
  .topbar .loc{ display:flex; align-items:center; gap:12px; }
  .topbar .loc .plate{
    background: var(--ink-2); border:1px solid var(--brass); border-radius:8px;
    padding:4px 12px; font-family:'Fraunces',serif; font-weight:700; letter-spacing:.08em; color: var(--brass-bright);
  }
  .round-pill{
    background: rgba(63,205,180,.12); border:1px solid var(--ai-teal); color: var(--ai-teal);
    border-radius: 999px; padding: 6px 14px; font-size:.82rem; font-weight:600;
  }

  .section-title{ font-size:.78rem; text-transform:uppercase; letter-spacing:.08em; color: rgba(241,233,216,.5); margin-bottom:10px; }
  .rules-list{ margin:0; padding-left:22px; color:rgba(241,233,216,.8); font-size:.88rem; line-height:1.7; }
  .rules-list li{ margin-bottom:4px; }
  .rules-list li::marker{ color:var(--brass); font-weight:700; }

  .empty{ text-align:center; padding: 30px 10px; color: rgba(241,233,216,.5); font-size:.9rem; }

  .kv{ display:flex; justify-content:space-between; font-size:.85rem; padding:4px 0; color: rgba(241,233,216,.7);}
  .divider{ height:1px; background: rgba(241,233,216,.12); margin: 14px 0; }

  .result-table{ width:100%; border-collapse: collapse; font-size:.88rem; }
  .result-table th{ text-align:left; font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; color: rgba(241,233,216,.45); padding-bottom:8px; }
  .result-table td{ padding: 8px 0; border-top: 1px solid rgba(241,233,216,.08); }
  .result-table tr.winner td:first-child{ color: var(--brass-bright); font-weight:700; }

  .toast{
    position:fixed; bottom: calc(24px + env(safe-area-inset-bottom,0px)); left:50%; transform: translateX(-50%);
    background: var(--ink-2); border:1px solid var(--brass); color: var(--parchment);
    padding: 12px 20px; border-radius: 12px; font-size:.88rem; box-shadow: var(--shadow); z-index:50;
    max-width: 90vw; text-align:center;
  }

  .kicker-crown{ font-size:2.4rem; text-align:center; margin-bottom:6px; }

  .link-btn{ background:none; border:none; color: var(--ai-teal); text-decoration:underline; font-size:.85rem; padding:0; }

  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background: rgba(241,233,216,.2); border-radius:4px; }

  .footer-note{ text-align:center; font-size:.72rem; color: rgba(241,233,216,.35); padding: 18px; }
</style>
</head>

<script>
(function(){
  "use strict";

  var PRODUCTS = JSON.parse(document.getElementById('products-data').textContent);
  var TOTAL_MAIN_ROUNDS = 8;
  var MAX_TIEBREAK_ROUNDS = 1;
  var LAST_ROUND_IDX = TOTAL_MAIN_ROUNDS + MAX_TIEBREAK_ROUNDS - 1; // absolute final round index across main + tiebreak
  var ROUND_DURATION_MS = 60000;
  var START_CREDITS = 10000;
  var WIN_BONUS = 2500;
  var MAX_PENALTY = 2500;
  var MAX_PASSES = 2; // max times a team may Pass across the whole game — bump to 3 if you'd prefer

  // ============================================================
  // FIREBASE SETUP — do this once before hosting this file
  // ============================================================
  // 1. Go to https://console.firebase.google.com and create a new
  //    project (the free "Spark" plan is enough for this game).
  // 2. In the project, open "Build > Firestore Database" and click
  //    "Create database". Choose "Start in production mode" (we set
  //    proper rules below) and any region close to your players.
  // 3. Open "Build > Authentication" > "Get started" > enable the
  //    "Anonymous" sign-in provider. This lets every host/player
  //    device connect without needing to create accounts.
  // 4. In Firestore, go to the "Rules" tab and paste this, then Publish:
  //
  //      rules_version = '2';
  //      service cloud.firestore {
  //        match /databases/{database}/documents {
  //          match /{document=**} {
  //            allow read, write: if request.auth != null;
  //          }
  //        }
  //      }
  //
  // 5. Back in Project settings (gear icon) > General > "Your apps",
  //    click the web icon (</>) to register a web app, and copy the
  //    firebaseConfig object it gives you into FIREBASE_CONFIG below.
  // 6. Upload this HTML file to any static host (GitHub Pages, S3,
  //    Netlify, your own web server, etc.) — no build step needed.
  // ============================================================
  var FIREBASE_CONFIG = {
    apiKey: "AIzaSyCp2em10Z8oGJ7VprSdPknpfbolYyDremo",
    authDomain: "price-wars-game.firebaseapp.com",
    projectId: "price-wars-game",
    storageBucket: "price-wars-game.firebasestorage.app",
    messagingSenderId: "1096439673612",
    appId: "1:1096439673612:web:0b1b4ffaa689ff8f7a0f29"
  };

  var root = document.getElementById('root');
  var fsDB = null;      // firestore instance
  var dbReady = false;
  var configMissing = (FIREBASE_CONFIG.apiKey.indexOf('YOUR_') === 0);

  var LS_KEY = 'pricewars_session_v1';

  var state = {
    role: null,        // 'host' | 'player'
    code: null,
    locationName: null,
    teamId: null,
    teamName: null,
    game: null,        // live game doc
    teams: [],         // live teams array [{id,...}]
    view: 'loading',
    hostSetupError: null,
    joinError: null,
    joinStep: 'code',  // 'code' | 'name'
    joinCodeInput: '',
    joinNameInput: '',
    joinMemberInput: '',
    joinMembers: [],
    hostNameInput: '',
    hostCodeInput: '',
    hostResumeInput: '',
    guessInput: '',
    showRulesModal: false,
    rulesAcknowledged: false,
    clockOffset: 0, // ms to add to this device's Date.now() to approximate Firestore server time
    now: Date.now()
  };

  // ============================================================
  // CLOCK SYNC — every device's round timer must agree, even if
  // phones/laptops have slightly wrong local clocks (very common).
  // We estimate this device's offset from Firestore's own server
  // clock once at startup, then apply it whenever we compute how
  // much time is left in a round, instead of trusting local time.
  // ============================================================
  function estimateClockOffset(){
    if(!fsDB) return Promise.resolve();
    var probeId = 'probe_' + Math.random().toString(36).slice(2, 10);
    var probeRef = fsDB.doc('_clocksync/' + probeId);
    var t0 = Date.now();
    return probeRef.set({ t: firebase.firestore.FieldValue.serverTimestamp() }).then(function(){
      return probeRef.get();
    }).then(function(snap){
      var t1 = Date.now();
      var roundTrip = t1 - t0;
      var serverMillis = snap.data().t.toMillis();
      var estimatedServerNow = serverMillis + (roundTrip / 2); // assume symmetric latency
      state.clockOffset = estimatedServerNow - t1;
      probeRef.delete().catch(function(){});
    }).catch(function(e){
      console.error('Clock sync failed, defaulting to no offset', e);
      state.clockOffset = 0;
    });
  }
  function correctedNow(){
    return Date.now() + state.clockOffset;
  }

  function loadSession(){
    try{
      var raw = localStorage.getItem(LS_KEY);
      if(!raw) return null;
      return JSON.parse(raw);
    }catch(e){ return null; }
  }
  function saveSession(s){
    try{ localStorage.setItem(LS_KEY, JSON.stringify(s)); }catch(e){}
  }
  function clearSession(){
    try{ localStorage.removeItem(LS_KEY); }catch(e){}
  }

  function fmtMoney(n){
    n = Math.round(n);
    var neg = n < 0;
    n = Math.abs(n);
    var s = n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    return (neg?'-':'') + 'USD ' + s;
  }
  function fmtCredits(n){
    n = Math.round(n);
    var s = Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    return (n<0?'-':'') + s;
  }

  function genCode(){
    var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    var out = '';
    for(var i=0;i<4;i++){ out += chars[Math.floor(Math.random()*chars.length)]; }
    return out;
  }

  function el(tag, attrs, children){
    var e = document.createElement(tag);
    attrs = attrs || {};
    for(var k in attrs){
      var v = attrs[k];
      if(v === null || v === undefined || v === false) continue; // omit falsy attrs entirely (disabled:false must NOT add the attribute)
      if(k === 'class'){ e.className = v; }
      else if(k === 'html'){ e.innerHTML = v; }
      else if(k.indexOf('on') === 0 && typeof v === 'function'){ e.addEventListener(k.slice(2), v); }
      else if(v === true){ e.setAttribute(k, ''); }
      else { e.setAttribute(k, v); }
    }
    (children||[]).forEach(function(c){
      if(c === null || c === undefined) return;
      if(typeof c === 'string' || typeof c === 'number'){ e.appendChild(document.createTextNode(String(c))); }
      else { e.appendChild(c); }
    });
    return e;
  }

  var toastTimer = null;
  function showToast(msg){
    var existing = document.querySelector('.toast');
    if(existing) existing.remove();
    var t = el('div', {class:'toast'}, [msg]);
    document.body.appendChild(t);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.remove(); }, 3200);
  }

  // ---------- DB HELPERS ----------

  function gameRef(code){ return fsDB.doc('games/' + code); }
  function teamsCol(code){ return fsDB.collection('games/' + code + '/teams'); }

  var unsubGame = null;
  var unsubTeams = null;

  function subscribeGame(code){
    if(unsubGame) unsubGame();
    unsubGame = gameRef(code).onSnapshot(function(snap){
      state.game = snap.exists ? snap.data() : null;
      render();
    }, function(err){
      console.error('game snapshot error', err);
    });
  }
  function subscribeTeams(code){
    if(unsubTeams) unsubTeams();
    unsubTeams = teamsCol(code).orderBy('credits','desc').onSnapshot(function(snap){
      state.teams = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      render();
    }, function(err){
      console.error('teams snapshot error', err);
    });
  }

  // ---------- GAME LOGIC ----------

  function currentRoundIdx(game){
    return (game && typeof game.currentRoundIndex === 'number') ? game.currentRoundIndex : -1;
  }
  function roundData(game, idx){
    if(!game || !game.rounds) return null;
    return game.rounds[String(idx)] || null;
  }
  function productForRound(game, idx){
    var pIdx = game.productOrder[idx];
    return PRODUCTS[pIdx];
  }
  function roundLabel(idx){
    if(idx < TOTAL_MAIN_ROUNDS) return 'Round ' + (idx+1) + ' of ' + TOTAL_MAIN_ROUNDS;
    return 'Tiebreaker ' + (idx - TOTAL_MAIN_ROUNDS + 1);
  }

  function hostStartRound(idx){
    var code = state.code;
    var patch = {};
    patch['rounds.' + idx] = {
      productIndex: state.game.productOrder[idx],
      status: 'active',
      startedAt: Date.now(),
      closedAt: null,
      guesses: {},
      results: {}
    };
    patch.currentRoundIndex = idx;
    patch.status = 'active';
    gameRef(code).update(patch).catch(function(e){ console.error(e); showToast('Could not start round.'); });
  }

  function computeAndCloseRound(idx){
    var game = state.game;
    var rd = roundData(game, idx);
    if(!rd || rd.status !== 'active') return;
    var product = PRODUCTS[rd.productIndex];
    var target = product.price;
    var guesses = rd.guesses || {};

    // gather per-team guess info, defaulting missing teams to "no answer"
    var teamsInfo = state.teams.map(function(t){
      var g = guesses[t.id];
      var hasGuess = g && g.passed === false && typeof g.guess === 'number';
      return {
        id: t.id,
        name: t.name,
        credits: t.credits,
        passed: g ? !!g.passed : true,
        guess: hasGuess ? g.guess : null,
        diff: hasGuess ? Math.abs(g.guess - target) : null
      };
    });

    var answered = teamsInfo.filter(function(t){ return t.diff !== null; });
    var minDiff = answered.length ? Math.min.apply(null, answered.map(function(t){ return t.diff; })) : null;

    var results = {};
    teamsInfo.forEach(function(t){
      var isWinner = (t.diff !== null && minDiff !== null && t.diff === minDiff);
      var change = 0;
      if(isWinner){
        change = WIN_BONUS;
      } else if(t.diff !== null){
        var pct = t.diff / target;
        change = -Math.min(Math.round(pct * MAX_PENALTY), MAX_PENALTY);
      }
      var newCredits = Math.max(0, t.credits + change);
      results[t.id] = {
        name: t.name,
        guess: t.guess,
        passed: t.passed,
        diff: t.diff,
        isWinner: isWinner,
        change: change,
        newCredits: newCredits
      };
    });

    var patch = {};
    patch['rounds.' + idx + '.status'] = 'closed';
    patch['rounds.' + idx + '.closedAt'] = Date.now();
    patch['rounds.' + idx + '.results'] = results;
    gameRef(state.code).update(patch).then(function(){
      // update each team's credits
      Object.keys(results).forEach(function(tid){
        teamsCol(state.code).doc(tid).update({ credits: results[tid].newCredits }).catch(function(){});
      });
    }).catch(function(e){ console.error(e); });
  }

  function tiedForFirst(teams){
    if(!teams.length) return [];
    var max = Math.max.apply(null, teams.map(function(t){ return t.credits; }));
    return teams.filter(function(t){ return t.credits === max; });
  }

  function hostAdvance(){
    var game = state.game;
    var idx = currentRoundIdx(game);
    var nextIdx = idx + 1;

    if(idx === TOTAL_MAIN_ROUNDS - 1 || (idx >= TOTAL_MAIN_ROUNDS && idx < LAST_ROUND_IDX)){
      // check tie after a round that could end the game
      var tied = tiedForFirst(state.teams);
      if(tied.length > 1 && idx < LAST_ROUND_IDX){
        hostStartRound(nextIdx);
        return;
      } else {
        finishGame();
        return;
      }
    }
    if(idx === LAST_ROUND_IDX){
      finishGame();
      return;
    }
    hostStartRound(nextIdx);
  }

  function finishGame(){
    var tied = tiedForFirst(state.teams);
    gameRef(state.code).update({
      status: 'finished',
      finishedAt: Date.now(),
      winnerTeamIds: tied.map(function(t){ return t.id; })
    }).catch(function(e){ console.error(e); });
  }

  var activeTimerHandle = null;
  function clearTimerLoop(){
    if(activeTimerHandle){ clearInterval(activeTimerHandle); activeTimerHandle = null; }
  }

  function render(){
    clearTimerLoop();
    root.innerHTML = '';
    if(configMissing){
      root.appendChild(renderNotice(
        'One-time setup needed',
        'This file needs a Firebase project connected before it can run. Open the HTML file in a text editor, read the FIREBASE SETUP comment near the top of the <script> tag, and fill in FIREBASE_CONFIG with your project\u2019s keys — then re-upload it to your host.'
      ));
      return;
    }
    if(!dbReady){
      root.appendChild(renderNotice('Connecting…', 'Setting up the game board.'));
      return;
    }
    if(fsDB === null){
      root.appendChild(renderNotice(
        'Can\u2019t reach the game board',
        'Could not connect to the database. Check your internet connection and that the Firebase config and rules are set up correctly, then reload this page.'
      ));
      return;
    }
    if(!state.role){
      root.appendChild(renderHome());
      return;
    }
    if(state.role === 'host'){
      root.appendChild(renderHostRoot());
      maybeStartTimerLoop();
      if(state.showRulesModal){ root.appendChild(renderRulesModal()); }
      return;
    }
    if(state.role === 'player'){
      root.appendChild(renderPlayerRoot());
      maybeStartTimerLoop();
      if(state.showRulesModal){ root.appendChild(renderRulesModal()); }
      return;
    }
  }

  // Countdown updates touch only the timer's own DOM nodes directly, instead
  // of triggering a full render() every tick — a full re-render would rebuild
  // the guess <input> too, stealing keyboard focus mid-type.
  function maybeStartTimerLoop(){
    if(!state.game) return;
    var idx = currentRoundIdx(state.game);
    if(idx < 0) return;
    var rd = roundData(state.game, idx);
    if(!rd || rd.status !== 'active') return;
    var totalMs = state.game.roundDurationMs;
    var startedAt = rd.startedAt;
    var autoCloseFired = false;

    function paintTimer(){
      var remaining = totalMs - (correctedNow() - startedAt);
      if(remaining <= 0){
        var circle0 = document.getElementById('timerProgressCircle');
        var numEl0 = document.getElementById('timerNumText');
        if(circle0){ circle0.setAttribute('stroke-dashoffset', (2*Math.PI*42).toFixed(1)); circle0.setAttribute('stroke','#E29999'); }
        if(numEl0){ numEl0.textContent = '0'; }
        if(state.role === 'host' && !autoCloseFired){
          autoCloseFired = true;
          clearTimerLoop();
          computeAndCloseRound(idx);
        }
        return;
      }
      var frac = Math.max(0, Math.min(1, remaining/totalMs));
      var r = 42, c = 2*Math.PI*r;
      var dash = c*frac;
      var secs = Math.ceil(remaining/1000);
      var color = frac < .2 ? '#E29999' : (frac < .5 ? '#E0B84B' : '#3FCDB4');
      var circle = document.getElementById('timerProgressCircle');
      var numEl = document.getElementById('timerNumText');
      if(circle){
        circle.setAttribute('stroke', color);
        circle.setAttribute('stroke-dasharray', c.toFixed(1));
        circle.setAttribute('stroke-dashoffset', (c-dash).toFixed(1));
      }
      if(numEl){ numEl.textContent = String(Math.max(0, secs)); }
    }
    activeTimerHandle = setInterval(paintTimer, 250);
  }

  function handleCreateLocation(){
    var name = state.hostNameInput.trim();
    if(!name){ state.hostSetupError = 'Give this location a name.'; render(); return; }
    var customCode = (state.hostCodeInput || '').trim();
    if(customCode && customCode.length < 2){ state.hostSetupError = 'Code must be at least 2 characters.'; render(); return; }
    state.hostSetupError = null;

    function createWithCode(code){
      var game = {
        code: code,
        locationName: name,
        createdAt: Date.now(),
        status: 'lobby',
        currentRoundIndex: -1,
        productOrder: [0,1,2,8,4,5,6,7,3], // Round 4 <-> tiebreaker swapped: celadon dish is now Round 4, pocket watch is now the tiebreaker
        totalMainRounds: TOTAL_MAIN_ROUNDS,
        roundDurationMs: ROUND_DURATION_MS,
        rounds: {},
        finishedAt: null,
        winnerTeamIds: []
      };
      gameRef(code).set(game).then(function(){
        state.code = code;
        state.locationName = name;
        saveSession({role:'host', code:code});
        subscribeGame(code);
        subscribeTeams(code);
        render();
      }).catch(function(e){
        console.error(e);
        state.hostSetupError = 'Could not create the game. Try again.';
        render();
      });
    }

    if(customCode){
      // check it isn't already taken by another game before creating
      gameRef(customCode).get().then(function(snap){
        if(snap.exists){
          state.hostSetupError = 'That code is already in use at another location \u2014 pick a different one, or use "Resume hosting" below if this is your own game.';
          render();
          return;
        }
        createWithCode(customCode);
      }).catch(function(e){
        console.error(e);
        state.hostSetupError = 'Could not check that code. Try again.';
        render();
      });
    } else {
      createWithCode(genCode());
    }
  }

  function handleDownloadResults(game){
    var ranked = sortedTeamsFor(state.teams);

    function csvEscape(val){
      var s = String(val === undefined || val === null ? '' : val);
      if(/[",\n]/.test(s)){ s = '"' + s.replace(/"/g, '""') + '"'; }
      return s;
    }

    var header = ['Rank', 'Team Name', 'Team Members', 'Final Credits', 'Winner'];
    var lines = [header.map(csvEscape).join(',')];
    ranked.forEach(function(t, i){
      var row = [
        i + 1,
        t.name,
        (t.members && t.members.length) ? t.members.join(', ') : '',
        t.credits,
        (game.winnerTeamIds||[]).indexOf(t.id) !== -1 ? 'Yes' : ''
      ];
      lines.push(row.map(csvEscape).join(','));
    });
    // BOM so Excel opens special characters (e.g. team names) correctly
    var csvContent = '\uFEFF' + lines.join('\r\n');

    var safeLocation = (game.locationName || 'game').replace(/[^a-z0-9]+/gi, '_');
    var filename = 'price_wars_results_' + safeLocation + '.csv';

    try{
      var blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    }catch(e){
      console.error('Download failed', e);
      showToast('Could not start the download. Try again, or take a screenshot of the leaderboard.');
    }
  }

  function sortedTeamsFor(teams){
    return teams.slice().sort(function(a,b){ return b.credits - a.credits; });

      state.teams.length === 0
        ? el('div', {class:'empty'}, ['No teams have joined yet.\nShare the code above.'])
        : el('div', {class:'team-list'}, state.teams.map(function(t,i){ return renderLeaderboardRow(t, i, game, true, true); }))
    ]);
  }

  function renderLeaderboardRow(t, i, game, withKick, showMembers){
    var isWinner = game.status === 'finished' && (game.winnerTeamIds||[]).indexOf(t.id) !== -1;
    var nameBlock = el('span', {class:'name'}, [t.name]);
    if(showMembers && t.members && t.members.length){
      nameBlock = el('div', {style:'flex:1;min-width:0;'}, [
        el('div', {class:'name'}, [t.name]),
        el('div', {class:'members-line'}, [t.members.join(', ')])
      ]);
    }
    var row = el('div', {class:'team-row' + (isWinner ? ' winner' : '')}, [
      el('span', {class:'rank'}, ['#'+(i+1)]),
      nameBlock,
      el('span', {class:'credits num'}, [fmtCredits(t.credits)])
    ]);
    if(withKick){
      var kick = el('button', {class:'link-btn', style:'margin-left:10px;font-size:.72rem;', onclick:function(e){
        e.stopPropagation();
        if(confirm('Remove team "'+t.name+'"?')){
          teamsCol(state.code).doc(t.id).delete().catch(function(){});
        }
      }}, ['remove']);
      row.appendChild(kick);
    }
    return row;
  }

  // ================= PLAYER =================

  function renderPlayerRoot(){
    if(!state.teamId){
      return renderPlayerJoin();
    }
    return renderPlayerGame();
  }

  function renderPlayerJoin(){
    if(state.joinStep === 'code'){
      return el('div', {class:'center-wrap'}, [
        el('div', {class:'shell'}, [
          brandMark(),
          el('div', {class:'card'}, [
            el('h2', {style:'font-size:1.2rem;margin-bottom:4px;'}, ['Enter your game code']),
            el('p', {style:'color:rgba(241,233,216,.6);font-size:.85rem;margin-bottom:18px;'}, ['Get this from your host.']),
            el('div', {class:'field'}, [
              el('input', {type:'text', placeholder:'e.g. K7QM', value:state.joinCodeInput, style:'text-align:center;font-size:1.4rem;letter-spacing:.15em;text-transform:uppercase;font-family:Fraunces,serif;', oninput:function(e){ state.joinCodeInput = e.target.value.toUpperCase(); }})
            ]),
            state.joinError ? el('p', {style:'color:#e2a3a3;font-size:.85rem;margin-bottom:10px;text-align:center;'}, [state.joinError]) : null,
            el('button', {class:'btn wide', onclick:function(){ handleCheckCode(); }}, ['Continue']),
            el('div', {style:'text-align:center;margin-top:16px;'}, [
              el('button', {class:'link-btn', onclick:function(){ state.role=null; render(); }}, ['\u2190 back'])
            ])
          ])
        ])
      ]);
    }
    // name step
    return el('div', {class:'center-wrap'}, [
      el('div', {class:'shell'}, [
        brandMark(),
        el('div', {class:'card'}, [
          el('div', {class:'code-plate', style:'margin-bottom:18px;'}, [
            el('div', {class:'sub'}, [state.locationName || 'LOCATION']),
            el('div', {class:'code'}, [state.code])
          ]),
          el('h2', {style:'font-size:1.15rem;margin-bottom:4px;'}, ['Name your team']),
          el('p', {style:'color:rgba(241,233,216,.6);font-size:.85rem;margin-bottom:16px;'}, ['Up to 5 players can share one screen.']),
          el('div', {class:'field'}, [
            el('label', {}, ['Team name']),
            el('input', {type:'text', placeholder:'Team name', value:state.joinNameInput, maxlength:'28', oninput:function(e){ state.joinNameInput = e.target.value; }})
          ]),
          el('div', {class:'field'}, [
            el('label', {}, ['Team members (full name)']),
            el('div', {class:'add-team-row'}, [
              el('input', {type:'text', id:'newMemberInput', placeholder:'Full name', maxlength:'40', value: state.joinMemberInput,
                oninput:function(e){ state.joinMemberInput = e.target.value; },
                onkeydown:function(e){ if(e.key === 'Enter'){ e.preventDefault(); handleAddMember(); } }
              }),
              el('button', {class:'btn small', onclick:function(){ handleAddMember(); }}, ['Add'])
            ])
          ]),
          state.joinMembers.length ? el('div', {class:'team-chip-list', style:'margin-bottom:16px;'}, state.joinMembers.map(function(m, i){
            return el('div', {class:'team-chip'}, [
              el('span', {class:'name'}, [m]),
              el('button', {onclick:function(){ handleRemoveMember(i); }}, ['remove'])
            ]);
          })) : null,
          state.joinError ? el('p', {style:'color:#e2a3a3;font-size:.85rem;margin-bottom:10px;text-align:center;'}, [state.joinError]) : null,
          el('button', {class:'btn wide', onclick:function(){ handleJoinTeam(); }}, ['Join game']),
          el('div', {style:'text-align:center;margin-top:16px;'}, [
            el('button', {class:'link-btn', onclick:function(){ state.joinStep='code'; state.joinError=null; render(); }}, ['\u2190 change code'])
          ])
        ])
      ])
    ]);
  }

  function handleAddMember(){
    var name = (state.joinMemberInput || '').trim();
    if(!name){ return; }
    if(state.joinMembers.length >= 10){ showToast('Maximum of 10 members.'); return; }
    state.joinMembers.push(name);
    state.joinMemberInput = '';
    render();
    var inp = document.getElementById('newMemberInput');
    if(inp) inp.focus();
  }
  function handleRemoveMember(i){
    state.joinMembers.splice(i, 1);
    render();
  }

  function handleCheckCode(){
    var code = state.joinCodeInput.trim().toUpperCase();
    if(!code){ state.joinError = 'Enter a code.'; render(); return; }
    gameRef(code).get().then(function(snap){
      if(!snap.exists){
        state.joinError = 'No game found with that code.';
        render();
        return;
      }
      state.code = code;
      state.locationName = snap.data().locationName;
      state.joinError = null;
      state.joinStep = 'name';
      render();
    }).catch(function(e){
      console.error(e);
      state.joinError = 'Something went wrong. Try again.';
      render();
    });
  }

  function handleJoinTeam(){
    var name = state.joinNameInput.trim();
    if(!name){ state.joinError = 'Give your team a name.'; render(); return; }
    var code = state.code;
    teamsCol(code).get().then(function(snap){
      if(snap.docs.length >= 10){
        state.joinError = 'This location already has 10 teams.';
        render();
        return;
      }
      var nameTaken = snap.docs.some(function(d){ return (d.data().name||'').toLowerCase() === name.toLowerCase(); });
      if(nameTaken){
        state.joinError = 'That team name is taken here \u2014 try another.';
        render();
        return;
      }
      teamsCol(code).add({ name: name, members: state.joinMembers.slice(), credits: START_CREDITS, passesUsed: 0, joinedAt: Date.now() }).then(function(ref){
        state.teamId = ref.id;
        state.teamName = name;
        state.joinError = null;
        saveSession({role:'player', code:code, teamId: ref.id, teamName: name});
        subscribeGame(code);
        subscribeTeams(code);
        render();
      }).catch(function(e){
        console.error(e);
        state.joinError = 'Could not join. Try again.';
        render();
      });
    }).catch(function(e){
      console.error(e);
      state.joinError = 'Something went wrong. Try again.';
      render();
    });
  }

  function renderPlayerGame(){
    var game = state.game;
    if(!game){
      return renderNotice('Joining\u2026', 'Getting your team to the table.');
    }
    var idx = currentRoundIdx(game);
    var myTeam = state.teams.find(function(t){ return t.id === state.teamId; });
    var wrap = el('div', {style:'flex:1;display:flex;flex-direction:column;'});
    var teamNameBlock = el('div', {}, [
      el('span', {style:'font-family:Fraunces,serif;font-weight:700;'}, [state.teamName])
    ]);
    if(myTeam && myTeam.members && myTeam.members.length){
      teamNameBlock.appendChild(el('div', {class:'members-line'}, [myTeam.members.join(', ')]));
    }
    wrap.appendChild(el('div', {class:'topbar'}, [
      el('div', {class:'loc'}, [teamNameBlock]),
      el('div', {style:'display:flex;align-items:center;gap:10px;'}, [
        el('span', {class:'round-pill'}, [idx<0 ? 'Lobby' : roundLabel(idx)]),
        rulesToggleButton(),
        el('button', {class:'btn secondary small', onclick:function(){ handleExitPlayer(); }}, ['Leave'])
      ])
    ]));

    var body;
    if(game.status === 'finished'){
      body = renderPlayerFinished(game, myTeam);
    } else if(idx < 0){
      body = renderPlayerLobby(game);
    } else {
      var rd = roundData(game, idx);
      if(rd && rd.status === 'active'){
        body = renderPlayerActiveRound(game, idx, rd, myTeam);
      } else if(rd && rd.status === 'closed'){
        body = renderPlayerRoundResults(game, idx, rd, myTeam);
      } else {
        body = renderPlayerLobby(game);
      }
    }
    wrap.appendChild(el('div', {class:'center-wrap'}, [el('div', {class:'shell'}, [body])]));
    return wrap;
  }

  function handleExitPlayer(){
    if(unsubGame) unsubGame();
    if(unsubTeams) unsubTeams();
    clearSession();
    state.role = null; state.code=null; state.teamId=null; state.teamName=null; state.game=null; state.teams=[];
    state.joinStep='code'; state.joinCodeInput=''; state.joinNameInput=''; state.joinMemberInput=''; state.joinMembers=[];
    render();
  }

  function renderPlayerLobby(game){
    var myRank = state.teams.findIndex(function(t){ return t.id===state.teamId; });
    return el('div', {}, [
      el('div', {class:'card'}, [
        el('h2', {style:'font-size:1.2rem;margin-bottom:6px;text-align:center;'}, ['You\u2019re in!']),
        el('p', {style:'color:rgba(241,233,216,.65);font-size:.88rem;text-align:center;margin-bottom:20px;'}, ['Waiting for the host to start Round 1. Get ready to out-guess the AI.']),
        el('div', {class:'team-list'}, state.teams.map(function(t,i){ return renderLeaderboardRow(t, i, game); }))
      ]),
      renderRulesCard()
    ]);
  }

  function renderPlayerActiveRound(game, idx, rd, myTeam){
    var product = PRODUCTS[rd.productIndex];
    var elapsed = correctedNow() - rd.startedAt;
    var remaining = game.roundDurationMs - elapsed;
    var myGuess = (rd.guesses||{})[state.teamId];
    var already = !!myGuess;

    var content = [
      el('div', {class:'section-title', style:'text-align:center;'}, [roundLabel(idx)]),
      renderProductCard(product, idx+1),
      renderTimerRing(Math.max(0,remaining), game.roundDurationMs)
    ];

    if(already){
      content.push(el('p', {class:'status-line'}, [
        myGuess.passed ? 'You passed this round.' : ('You guessed ' + fmtMoney(myGuess.guess) + '.')
      ]));
      content.push(el('p', {class:'status-line'}, ['Waiting for the host to close the round\u2026']));
    } else if(remaining <= 0){
      content.push(el('p', {class:'status-line'}, ['Time\u2019s up \u2014 waiting for results\u2026']));
    } else {
      var passesUsed = (myTeam && myTeam.passesUsed) || 0;
      var passesLeft = Math.max(0, MAX_PASSES - passesUsed);
      content.push(el('div', {class:'guess-row', style:'margin-bottom:12px;'}, [
        el('span', {class:'prefix'}, ['USD']),
        el('input', {type:'number', inputmode:'numeric', placeholder:'Your guess', value:state.guessInput, oninput:function(e){ state.guessInput = e.target.value; }})
      ]));
      content.push(el('div', {style:'display:flex;gap:10px;'}, [
        el('button', {class:'btn wide', onclick:function(){ handleSubmitGuess(idx); }}, ['Submit guess']),
        el('button', {class:'btn secondary', disabled: passesLeft <= 0, onclick:function(){ handlePass(idx, myTeam); }}, [passesLeft > 0 ? ('Pass (' + passesLeft + ' left)') : 'No passes left'])
      ]));
    }

    return el('div', {class:'card'}, content);
  }

  function handleSubmitGuess(idx){
    var val = parseFloat(state.guessInput);
    if(isNaN(val) || val < 0){ showToast('Enter a valid price.'); return; }
    var patch = {};
    patch['rounds.' + idx + '.guesses.' + state.teamId] = {
      teamName: state.teamName, guess: val, passed: false, submittedAt: Date.now()
    };
    gameRef(state.code).update(patch).then(function(){
      state.guessInput = '';
    }).catch(function(e){ console.error(e); showToast('Could not submit. Try again.'); });
  }

  function handlePass(idx, myTeam){
    var used = (myTeam && myTeam.passesUsed) || 0;
    if(used >= MAX_PASSES){ showToast('No passes left \u2014 enter a guess instead.'); return; }
    var patch = {};
    patch['rounds.' + idx + '.guesses.' + state.teamId] = {
      teamName: state.teamName, guess: null, passed: true, submittedAt: Date.now()
    };
    gameRef(state.code).update(patch).then(function(){
      return teamsCol(state.code).doc(state.teamId).update({ passesUsed: used + 1 });
    }).catch(function(e){ console.error(e); showToast('Could not submit. Try again.'); });
  }

  function renderPlayerRoundResults(game, idx, rd, myTeam){
    var product = PRODUCTS[rd.productIndex];
    var myResult = myTeam ? (rd.results||{})[myTeam.id] : null;
    var content = [
      el('div', {class:'section-title', style:'text-align:center;'}, [roundLabel(idx) + ' \u00b7 results']),
      el('div', {style:'display:flex;align-items:center;gap:14px;margin-bottom:16px;background:var(--parchment);color:var(--text-dark);border-radius:14px;padding:14px 16px;'}, [
        el('img', {src:product.img, style:'width:56px;height:56px;object-fit:cover;border-radius:8px;flex-shrink:0;'}),
        el('div', {}, [
          el('div', {style:'font-size:.72rem;color:#7a6f57;text-transform:uppercase;letter-spacing:.04em;'}, ['AI appraised value']),
          el('div', {style:'font-family:Fraunces,serif;font-weight:700;font-size:1.25rem;'}, [fmtMoney(product.price)])
        ])
      ])
    ];
    if(myResult){
      content.push(el('div', {class:'card', style:'background:rgba(241,233,216,.06);margin-bottom:16px;padding:16px;'}, [
        el('p', {style:'text-align:center;font-size:1.4rem;margin-bottom:4px;'}, [myResult.isWinner ? '\uD83C\uDFC6' : (myResult.passed ? '\u23F8\uFE0F' : (myResult.change<0 ? '\uD83D\uDCC9' : '\u2013'))]),
        el('p', {style:'text-align:center;font-weight:700;'}, [
          myResult.isWinner ? 'Closest guess! ' : (myResult.passed ? 'You passed. ' : 'Not this time. '),
          myResult.change !== 0 ? (myResult.change>0 ? el('span',{class:'delta-up'},['+'+fmtCredits(myResult.change)]) : el('span',{class:'delta-down'},[fmtCredits(myResult.change)])) : el('span',{class:'delta-flat'},['no change'])
        ])
      ]));
    }
    content.push(el('div', {class:'section-title'}, ['Standings']));
    content.push(el('div', {class:'team-list'}, state.teams.map(function(t,i){ return renderLeaderboardRow(t, i, game); })));
    content.push(el('p', {class:'status-line'}, ['Waiting for the host to start the next round\u2026']));
    return el('div', {class:'card'}, content);
  }

  function renderPlayerFinished(game, myTeam){
    var winners = state.teams.filter(function(t){ return (game.winnerTeamIds||[]).indexOf(t.id) !== -1; });
    var iWon = myTeam && winners.some(function(w){ return w.id===myTeam.id; });
    return el('div', {class:'card'}, [
      el('div', {class:'kicker-crown'}, [iWon ? '\uD83C\uDF89' : '\uD83C\uDFC6']),
      el('h2', {style:'text-align:center;font-size:1.3rem;margin-bottom:6px;'}, [iWon ? 'You beat the AI!' : (winners.length>1?'It\u2019s a tie!':'We have a winner')]),
      el('p', {style:'text-align:center;color:var(--brass-bright);font-family:Fraunces,serif;font-size:1.3rem;margin-bottom:18px;'}, [winners.map(function(w){return w.name;}).join(' & ') || '\u2014']),
      el('div', {class:'team-list'}, state.teams.map(function(t,i){ return renderLeaderboardRow(t, i, game); }))
    ]);
  }

  // ---------- INIT ----------
  // Countdown updates are handled by maybeStartTimerLoop() inside render(),
  // which touches only the timer's own DOM nodes directly — this keeps a
  // full re-render from firing every tick and stealing focus out of the
  // guess input box while someone is mid-type.

  function resumeSavedSession(){
    var saved = loadSession();
    if(!saved){ render(); return; }
    state.role = saved.role;
    state.code = saved.code;
    if(saved.role === 'player'){
      state.teamId = saved.teamId;
      state.teamName = saved.teamName;
    }
    gameRef(state.code).get().then(function(snap){
      if(snap.exists){
        state.locationName = snap.data().locationName;
        subscribeGame(state.code);
        subscribeTeams(state.code);
      } else {
        clearSession();
        state.role = null; state.code = null; state.teamId = null;
      }
      render();
    }).catch(function(){ render(); });
  }

  function init(){
    if(configMissing){
      render();
      return;
    }
    if(typeof firebase === 'undefined'){
      dbReady = true; fsDB = null; render();
      return;
    }
    try{
      var app = firebase.initializeApp(FIREBASE_CONFIG);
      fsDB = app.firestore();
      var auth = app.auth();
      auth.onAuthStateChanged(function(user){
        if(user){
          dbReady = true;
          estimateClockOffset().then(function(){
            resumeSavedSession();
          });
        }
      });
      auth.signInAnonymously().catch(function(e){
        console.error('Firebase auth error', e);
        dbReady = true; fsDB = null; render();
      });
    }catch(e){
      console.error('Firebase init error', e);
      dbReady = true; fsDB = null; render();
    }
    render();
  }

  init();
})();
</script>
</body>
</html>
